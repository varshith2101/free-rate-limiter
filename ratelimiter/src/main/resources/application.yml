server:
  port: 8081

spring:
  application:
    name: rate-limiter-service

  # Active profile (default: dev)
  # Use 'prod' for production with PostgreSQL
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # H2 In-Memory Database (for development)
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:ratelimiter}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: ${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}

  # Redis Configuration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms
      client-type: lettuce
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
            required: ${MAIL_STARTTLS_REQUIRED:true}
          ssl:
            enable: ${MAIL_SSL_ENABLE:false}
            trust: ${MAIL_SSL_TRUST:${MAIL_HOST:smtp.gmail.com}}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:10000}
          timeout: ${MAIL_TIMEOUT:10000}
          writetimeout: ${MAIL_WRITE_TIMEOUT:10000}

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-secret-key-for-production}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

app:
  mail:
    from: ${MAIL_FROM:noreply@ratelimiter.local}
  auth:
    mode: ${AUTH_MODE:standard}
    admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}

# Management Endpoints (Actuator)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    mail:
      enabled: false
  # Updated Prometheus configuration for Spring Boot 4.x
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    com.varshith.ratelimiter: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.springframework.data.redis: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Rate Limiter Custom Properties (for future extensibility)
rate-limiter:
  # Fail-open or fail-closed when Redis is unavailable
  fail-strategy: fail-open
  # Enable/disable metrics collection
  metrics-enabled: true
  # Default limits when no config found
  default-limits:
    free-tier: 100
    pro-tier: 1000
    enterprise-tier: 10000