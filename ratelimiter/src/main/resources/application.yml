server:
  port: 8080

spring:
  application:
    name: rate-limiter-service
  
  # H2 In-Memory Database (for development)
  datasource:
    url: jdbc:h2:mem:ratelimiter
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      client-type: lettuce
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# Management Endpoints (Actuator)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  # Updated Prometheus configuration for Spring Boot 4.x
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    com.varshith.ratelimiter: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG